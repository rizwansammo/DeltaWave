# Local development database for DeltaWave Technology.
# Dedicated to this project: its own container, volume and localhost-only port.
# Credentials come from the untracked .env file (create it with `pnpm setup:env`).
name: deltawave

services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: deltawave-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54330}:5432"
    volumes:
      # PostgreSQL 18+ images keep PGDATA at /var/lib/postgresql/18/docker.
      - deltawave-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  deltawave-pgdata:
    name: deltawave-pgdata
