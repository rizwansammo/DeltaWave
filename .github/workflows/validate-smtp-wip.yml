# Isolated validation of the unfinished SMTP work. Does not publish images or deploy.
name: Validate CMS SMTP WIP

on:
  push:
    branches:
      - fix/cms-managed-smtp-wip
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smtp-wip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: deltawave_test
          POSTGRES_USER: deltawave
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U deltawave -d deltawave_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://deltawave:ci-only-postgres-password@127.0.0.1:54330/deltawave
      PAYLOAD_SECRET: ci-placeholder-not-a-real-secret-0000000000
      CREDENTIALS_ENCRYPTION_KEY: 7e577e577e577e577e577e577e577e577e577e577e577e577e577e577e577e577e57
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SITE_INDEXABLE: "false"
      TURNSTILE_SITE_KEY: ""
      TURNSTILE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build for production
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser and CMS API tests
        run: pnpm test:e2e
      - name: Upload test failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smtp-wip-test-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
