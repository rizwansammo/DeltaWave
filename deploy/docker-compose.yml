# DeltaWave Technology production stack, /opt/DeltaWave on the VPS.
# Isolated from every other project on the server: its own Compose project,
# network, volumes, database and environment files. The application image is
# pulled from GHCR by digest (DELTAWAVE_IMAGE in .env); it is never built here.
#
#   docker compose pull app
#   docker compose run --rm app node node_modules/payload/bin.js migrate
#   docker compose up -d
name: deltawave

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    env_file: .env.db
    volumes:
      - db:/var/lib/postgresql
    networks: [deltawave]
    # Small footprint: the server hosts many other applications.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    shm_size: 128m
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  app:
    image: ${DELTAWAVE_IMAGE:?Set DELTAWAVE_IMAGE to ghcr.io/rizwansammo/deltawave@sha256:...}
    restart: unless-stopped
    env_file: .env.app
    environment:
      MEDIA_DIR: /app/media
      NODE_OPTIONS: --max-old-space-size=448
    depends_on:
      db:
        condition: service_healthy
    # Reachable only through the server's own Nginx.
    ports:
      - "127.0.0.1:${DELTAWAVE_PORT:-3077}:3000"
    volumes:
      - media:/app/media
    networks: [deltawave]
    mem_limit: 640m
    cpus: 1.5
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  deltawave:
    name: deltawave_net

volumes:
  db:
    name: deltawave_db
  media:
    name: deltawave_media
