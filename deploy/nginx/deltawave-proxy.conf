# Proxy settings for the DeltaWave application (included by deltawave.tech.conf).
proxy_pass http://deltawave_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The application trusts only these, and Nginx always overwrites them, so a
# visitor cannot choose the address used for rate limiting.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header CF-Connecting-IP "";
# Streamed server rendering reaches the browser as it is produced.
proxy_buffering off;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
