# DeltaWave Technology: https://www.deltawave.tech
# One self-contained virtual host; it changes nothing for any other site.
# The application listens on 127.0.0.1:3077 (Docker Compose project "deltawave").

# Throttles for sign-in, password reset and enquiry submissions (DeltaWave
# only). The contact page reads /api/enquiry on every visit, so only POST
# counts towards the form limit: an empty key is never limited.
map $request_method $deltawave_form_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $binary_remote_addr zone=deltawave_auth:10m rate=10r/m;
limit_req_zone $deltawave_form_key zone=deltawave_forms:10m rate=6r/m;

upstream deltawave_app {
    server 127.0.0.1:3077;
    keepalive 16;
}

# HTTP: certificate challenges, then everything to the canonical HTTPS host.
server {
    listen 80;
    listen [::]:80;
    server_name deltawave.tech www.deltawave.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/deltawave-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://www.deltawave.tech$request_uri;
    }
}

# Apex over HTTPS: redirect to www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deltawave.tech;

    ssl_certificate /etc/letsencrypt/live/deltawave.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deltawave.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.deltawave.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.deltawave.tech;

    ssl_certificate /etc/letsencrypt/live/deltawave.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deltawave.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # This host only (no includeSubDomains, no preload). Raise after launch.
    add_header Strict-Transport-Security "max-age=2592000" always;

    # Media uploads are limited to 10 MB by Payload.
    client_max_body_size 12m;
    limit_req_status 429;

    access_log /var/log/nginx/deltawave.access.log;
    error_log /var/log/nginx/deltawave.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/deltawave-acme;
        default_type text/plain;
    }

    location = /cms-api/users/login {
        limit_req zone=deltawave_auth burst=5 nodelay;
        include /etc/nginx/snippets/deltawave-proxy.conf;
    }
    location = /cms-api/users/forgot-password {
        limit_req zone=deltawave_auth burst=3 nodelay;
        include /etc/nginx/snippets/deltawave-proxy.conf;
    }
    location = /api/enquiry {
        limit_req zone=deltawave_forms burst=4 nodelay;
        include /etc/nginx/snippets/deltawave-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/deltawave-proxy.conf;
    }
}
